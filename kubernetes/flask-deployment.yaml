
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-api

  template:
    metadata:
      labels:
        app: flask-api

    spec:
      containers:
        - name: flask-api
          image: task15-flask-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000


apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
spec:
  replicas: 2

  selector:
    matchLabels:
      app: streamlit

  template:
    metadata:
      labels:
        app: streamlit

    spec:
      containers:
        - name: streamlit
          image: task15-streamlit:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8501

          env:
            - name: FLASK_API_URL
              value: "http://flask-api-service:5000"
